[project]
name = "dworshak-prompt"
#version = "x.x.x"
dynamic = ["version"] # look in src/dworshk_prompt/VERSION
description = "Multiplexed user input via console, GUI, and web, depending on availability."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "dworshak-config>=0.2.8",
    "dworshak-env>=0.1.8",
    "dworshak-secret>=1.3.5.1",
    "pyhabitat>=1.2.7",
]

authors = [
  { name="George Clayton Bennett", email="george.bennett@memphistn.gov" },
]
maintainers = [
  { name="George Clayton Bennett", email="george.bennett@memphistn.gov" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    #"Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    #"Development Status :: 3 - Alpha",
    "Development Status :: 4 - Beta",
    #"Development Status :: 5 - Production/Stable",
]

keywords = [
    # Core concept
    "prompt",
    "user-input",
    "interactive",

    # Environment awareness
    "ci",
    "cd",
    "ci-cd",
    "headless",
    "non-interactive",

    # Shell & scripting
    "cli",
    "shell",
    "bash",
    "scripting",

    # Config & secrets
    "configuration",
    "config-management",
    "secrets",
    "secret-management",
    "credentials",
    "environment-variables",
    "dotenv",

    # Use cases / pain points
    "devops",
    "automation",
    "pipelines",
    "github-actions",

    # Ecosystem / architecture
    "fallback",
    "cross-platform",
    "wsl"
]

[project.urls]
Homepage = "https://github.com/city-of-memphis-wastewater/dworshak-prompt"
Repository = "https://github.com/city-of-memphis-wastewater/dworshak-prompt"

[project.scripts]
dworshak-prompt = "dworshak_prompt.__main__:run"

[project.optional-dependencies]
typer = [
    "typer>=0.21.1",
    "rich>=14.3.2",
    "typer-helptree>=0.2.10.5",
    "click>=8.1.8"
]
crypto = [
    "cryptography>=46.0.3",
    "dworshak-secret[crypto]", # without this, Obtain.secret() will show an error message()
]
full = [
    "dworshak-prompt[typer,crypto]"
]

[tool.uv]
# This tells uv that if it can't find a wheel for aarch64,
# it is allowed to build from source using your local Rust/Clang.
package = true
resolution = "highest"

[tool.uv.sources] # for hardcoding local wheels, to test without leveraging PyPI.
dworshak-prompt = { workspace = true }
#pyhabitat = { path = "../pyhabitat/dist/pyhabitat-0.2.4-py3-none-any.whl" }
#dworshak-config = { path = "../dworshak-config/dist/dworshak_config-0.2.8-py3-none-any.whl" }
#dworshak-secret = { path = "../dworshak-secret/dist/dworshak_secret-1.3.5-py3-none-any.whl" }
#dworshak-env = { path = "../dworshak-env/dist/dworshak_env-0.1.8-py3-none-any.whl" }
#typer-helptree = { path = "../typer-helptree/dist/typer_helptree-0.2.10.2-py3-none-any.whl" }

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
test = [
    "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "src/dworshak_prompt/VERSION"}


